@if (isLoading) {
  <p>Chargement...</p>
} @else if (departements.length > 0) {
  <table class="table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Département</th>
        <th scope="col">Description</th>
      </tr>
    </thead>
    <tbody>
      @for (dep of departements; track dep.id; let i = $index) {
        <tr>
          <th scope="row">{{ i + 1 }}</th>
          <td>{{ dep.libelle }}</td>
          <td>{{ dep.description }}</td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <div class="alert alert-info mt-3">
    Aucun département disponible.
  </div>
}
